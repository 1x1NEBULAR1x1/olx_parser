# SmartFlip — reverse proxy для Next.js (приложение слушает 127.0.0.1:8080)
#
# Установка:
#   sudo cp deploy/nginx/smartflip.conf /etc/nginx/sites-available/smartflip
#   sudo ln -sf /etc/nginx/sites-available/smartflip /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Замените your-domain.example на реальный домен.

upstream smartflip_upstream {
    server 127.0.0.1:8080;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=smartflip_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=smartflip_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # После certbot раскомментируйте редирект:
    # return 301 https://$host$request_uri;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Healthcheck (без auth, для мониторинга) ---
    location = /api/health {
        proxy_pass http://smartflip_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --- NextAuth / Google OAuth ---
    location ^~ /api/auth/ {
        limit_req zone=smartflip_auth burst=20 nodelay;
        proxy_pass http://smartflip_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # --- API (сканирование OLX — долгие запросы) ---
    location ^~ /api/ {
        limit_req zone=smartflip_api burst=60 nodelay;
        proxy_pass http://smartflip_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- Статика Next.js (immutable) ---
    location ^~ /_next/static/ {
        proxy_pass http://smartflip_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /_next/image {
        proxy_pass http://smartflip_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Страницы: /, /login, /pending, /settings, /favorites, /admin, /notifications, /devices/* ---
    location / {
        proxy_pass http://smartflip_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

