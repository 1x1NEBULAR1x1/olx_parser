# SmartFlip — nginx reverse proxy. Приложение: 127.0.0.1:8080
#
# SSL (на сервере):
#   sudo CERTBOT_EMAIL=you@mail.com bash deploy/nginx/setup-smartflip-ssl.sh
#
# Без SSL — только HTTP:
#   sudo cp deploy/nginx/smartflip.conf /etc/nginx/sites-available/smartflip
#   sudo ln -sf /etc/nginx/sites-available/smartflip /etc/nginx/sites-enabled/

upstream smartflip_upstream {
    server 127.0.0.1:8080;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=smartflip_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=smartflip_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name v915607.hosted-by-vdsina.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    include /etc/nginx/snippets/smartflip-locations.inc;
}

# HTTPS блок добавляет setup-smartflip-ssl.sh после выпуска сертификата.
