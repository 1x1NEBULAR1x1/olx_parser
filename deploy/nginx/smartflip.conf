# SmartFlip — reverse proxy для Next.js (приложение: 127.0.0.1:8080)
#
# ВАЖНО: на одном сервере с relpen.org у каждого сайта свой server_name.
# Если server_name не совпадает — nginx отдаёт default_server (часто relpen + редирект).
#
# Установка:
#   sudo cp deploy/nginx/smartflip.conf /etc/nginx/sites-available/smartflip
#   sudo ln -sf /etc/nginx/sites-available/smartflip /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Замените домены ниже на свои. Временный URL VDSina оставьте, пока нет своего домена.

upstream smartflip_upstream {
    server 127.0.0.1:8080;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=smartflip_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=smartflip_api:10m rate=120r/m;

# --- HTTP ---
server {
    listen 80;
    listen [::]:80;
    # Все домены, по которым должен открываться SmartFlip (через пробел):
    server_name v677071.hosted-by-vdsina.com smartflip.example.com;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location = /api/health {
        proxy_pass http://smartflip_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location ^~ /api/auth/ {
        limit_req zone=smartflip_auth burst=20 nodelay;
        proxy_pass http://smartflip_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location ^~ /api/ {
        limit_req zone=smartflip_api burst=60 nodelay;
        proxy_pass http://smartflip_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /_next/static/ {
        proxy_pass http://smartflip_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /_next/image {
        proxy_pass http://smartflip_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://smartflip_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

